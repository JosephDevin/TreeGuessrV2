<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />

<body>

            </g>
        </svg>
        <p>Chargement des images...</p>
    </div>
</div>

<div id="content" class="is-hidden">
    <div class="title-row">
        <h1 id="title">Tree Guessr</h1>
        <h2 id="round">Placeholder</h2>
    </div>

    <div class="gallery">
        <div class="slot"><img src="" id="slot1" /></div>
        <div class="slot"><img src="" id="slot2" /></div>
        <div class="slot"><img src="" id="slot3" /></div>
    </div>

    <p id="hint" class="is-hidden">Indice: </p>

    <div class="controls">
        <div class="input-row">
            <span id="scoreText">Score: 5000</span>

            <div class="input-wrapper">
                <input id="answer" type="text" placeholder="Votre réponse..." autocomplete="off" />
                <ul id="suggestions" class="is-hidden" role="listbox"></ul>
            </div>

            <button id="skip" class="btn" type="button">⏩ Passer</button>
        </div>

    </div>

</div>

<script src="shake.js"></script>
<script type="module" src="game.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>

</body>
</html>
