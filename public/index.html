<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tree Guessr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
<main class="shell">
    <section class="card" role="region" aria-label="Accueil Tree Guessr">
        <h1>Tree Guessr</h1>
        <p class="subtitle">Un jeu où vous devinez l'arbre à partir d'une photo. Prêt à mettre vos connaissances botaniques à l'épreuve&nbsp;?</p>
        <div class="cta-group">
            <a class="cta" aria-label="Jouer à Tree Guessr maintenant" id="playBtn">
                <span class="icon" aria-hidden="true">🌳</span>
                <span>Jouer</span>
            </a>

            <div class="mode-select" id="modeSelect">
                <button class="mode-btn" type="button" aria-haspopup="listbox" id="modeBtn">
                    <span class="mode-label">🌱</span>
                    <span class="chevron">▾</span>
                </button>

                <ul class="mode-menu" role="listbox">
                    <li data-value="standard" data-tooltip="Mode standard">🌱 Mode standard</li>
                    <li data-value="chrono" data-tooltip="Mode chrono">⏱️ Mode chrono</li>
                    <li data-value="survival" data-tooltip="Mode survie">🐻 Mode survie</li>
                </ul>
            </div>
        </div>
        <div class="high-score" id="highScore">
            Meilleur score : 0
        </div>
    </section>
</main>

<script>

    localStorage.removeItem('chronometer');

    console.log("==========Notice à l'utilisateur==========")
    console.log("Il manque encore un peu de filtrage de données, certaines photos n'apparaitront pas, rechargez la page. Certaines photos ne sont pas des arbres, rechargez ou tentez de deviner!")

    /* ====================================
    Declare all UI elements
    ======================================== */
    const button = document.getElementById("playBtn");

    const modeSelect = document.getElementById("modeSelect");
    const modeBtn = document.getElementById("modeBtn");
    const labelMode = modeSelect.querySelector(".mode-label");
    const itemsMode = modeSelect.querySelectorAll(".mode-menu li[data-value]");


    // Setup local storage values
    localStorage.setItem("score", 0);
    localStorage.setItem("mode", 'standard');

    if (localStorage.getItem("highScore") == null) {
        localStorage.setItem("highScore", 0);
    }

    document.getElementById("highScore").textContent = "Meilleur score : " + localStorage.getItem("highScore");

    /* ====================================
    LAUNCH GAME
    ======================================== */
    button.addEventListener("click", () => {
        localStorage.setItem("round", 1);

        window.location.href = `/game/game.html`;
    })

    const areaItems = document.querySelectorAll(".area-menu li[data-value]");
    let tooltipEl = null;

    areaItems.forEach(item => {
        item.addEventListener("mouseenter", () => {
            const text = item.dataset.tooltip;
            if (!text) return;

            tooltipEl = document.createElement("div");
            tooltipEl.className = "tooltip";
            tooltipEl.textContent = text;
            document.body.appendChild(tooltipEl);

            const rect = item.getBoundingClientRect();

            tooltipEl.style.left = `${rect.right + 8}px`;
            tooltipEl.style.top = `${rect.top + rect.height / 2 - tooltipEl.offsetHeight / 2}px`;
        });

        item.addEventListener("mouseleave", () => {
            if (tooltipEl) tooltipEl.remove();
            tooltipEl = null;
        });
    });


    // MODE SELECTOR

    modeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        modeSelect.classList.toggle("open");
    });

    // Select an item
    itemsMode.forEach(item => {
        item.addEventListener("click", () => {
            itemsMode.forEach(i => i.classList.remove("selected"));
            item.classList.add("selected");
            labelMode.textContent = item.textContent === '🌱 Mode standard' ? '🌱'
                                    : item.textContent === '⏱️ Mode chrono' ? '⏱️'
                                    : '🐻';
            modeSelect.classList.remove("open");
            modeSelect.dataset.selected = item.dataset.value;

            localStorage.setItem("mode", item.dataset.value);
        });
    });

    // Close when clicking outside
    document.addEventListener("click", () => modeSelect.classList.remove("open"));

    document.addEventListener("keydown", (e) => {
        if(e.key === "Escape") modeSelect.classList.remove("open");
    });

</script>
</body>
</html>
